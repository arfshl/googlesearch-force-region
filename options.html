<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="extensionName"></title>
    <link rel="stylesheet" href="./src/options-post.css">
</head>

<body class="m-0 bg-white p-10 font-sans text-gray-900 dark:bg-gray-950 dark:text-gray-100">

<main class="mx-auto max-w-225">

    <h1 class="mb-7.5 text-3xl font-bold tracking-tight" data-i18n="settings"></h1>

    <div class="grid grid-cols-1 gap-10 md:grid-cols-2">

        <!-- Region -->

        <section>

            <h2 class="mb-2 text-xl font-bold" data-i18n="region"></h2>

            <p class="mb-4 text-sm text-gray-500 dark:text-gray-400" data-i18n="regionDescription"></p>

            <div id="regions" class="max-h-125 overflow-y-auto rounded-lg border border-gray-300 dark:border-gray-700">
            </div>

        </section>

        <!-- Language -->

        <section>

            <h2 class="mb-2 text-xl font-bold" data-i18n="language"></h2>

            <p class="mb-4 text-sm text-gray-500 dark:text-gray-400" data-i18n="languageDescription"></p>

            <div id="languages" class="max-h-125 overflow-y-auto rounded-lg border border-gray-300 dark:border-gray-700">
            </div>

        </section>

    </div>

    <!-- Save settings -->

    <button id="save" class="mt-7.5 cursor-pointer rounded-full bg-blue-200 px-6 py-2 font-medium text-blue-900 transition hover:bg-blue-300 active:scale-95" data-i18n="save">
    </button>

    <span id="status" class="ml-3 inline-block text-sm text-gray-500 dark:text-gray-400"></span>

</main>

<script src="region-data.js"></script>
<script src="options.js"></script>

</body>

</html>
